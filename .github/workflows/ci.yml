name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gui: ["ON", "OFF"]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3-dev libjson-c-dev
          if [ "${{ matrix.gui }}" = ON ]; then
            sudo apt-get install -y libx11-dev xfonts-base xvfb
          fi
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPython3_EXECUTABLE=/usr/bin/python3
          -DCPYMACS_GUI=${{ matrix.gui }}
          -DCPYMACS_SANITIZERS=${{ matrix.sanitize }}
      - run: cmake --build build -j2
      - name: Test native engine, backend, and frontends
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure
      - name: Check native text-store leaks
        if: matrix.sanitize == 'ON'
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ./build/test_text
      - name: Install to a staging prefix
        run: cmake --install build --prefix "$RUNNER_TEMP/cpymacs"
      - name: Check installed plugin discovery
        run: |
          printf '%s\n' '{"op":"command","name":"python-mode"}' |
            "$RUNNER_TEMP/cpymacs/bin/cpymacs" --batch --no-user-config
      - name: Check static documentation
        run: /usr/bin/python3 tests/check_docs.py
